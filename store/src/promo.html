<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="scene.css">
<style>
  /* Céu da marca: índigo noturno, brilho dourado da lua atrás da coruja. */
  body {
    display: grid; place-items: center;
    background:
      radial-gradient(38vh 38vh at 30% 50%, rgba(245, 227, 192, .16), transparent 70%),
      radial-gradient(90% 120% at 30% 40%, #2a2860 0%, #17153a 45%, #0c0b1c 100%);
  }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars i { position: absolute; width: .9vh; height: .9vh; border-radius: 50%; background: #f5e3c0; box-shadow: 0 0 1.6vh 0.3vh rgba(245, 227, 192, .55); }
  .wrap { position: relative; display: flex; align-items: center; gap: 6%; width: 88%; }
  .art {
    flex: none; width: min(64vh, 30vw); height: min(64vh, 30vw); border-radius: min(15vh, 7vw);
    box-shadow: 0 4vh 10vh -2vh rgba(0, 0, 0, .6), 0 0 12vh -2vh rgba(255, 168, 70, .35);
  }
  .name { white-space: nowrap; font-size: min(17vh, 8.4vw); font-weight: 700; letter-spacing: -.02em; line-height: 1; color: #f5f5f7; }
  .tag { margin-top: 3.5vh; font-size: min(7.6vh, 3.9vw); line-height: 1.3; color: rgba(245, 227, 192, .72); }
  .tag em { font-style: normal; background: linear-gradient(135deg, #ffc870, #ff8a2a); -webkit-background-clip: text; color: transparent; font-weight: 600; }
</style>
</head>
<body>
  <div class="stars">
    <i style="left:8%;top:14%"></i><i style="left:46%;top:10%;transform:scale(.7)"></i><i style="left:63%;top:20%;transform:scale(.6)"></i>
    <i style="left:88%;top:12%"></i><i style="left:92%;top:78%;transform:scale(.7)"></i><i style="left:56%;top:86%;transform:scale(.5)"></i>
    <i style="left:4%;top:84%;transform:scale(.6)"></i>
  </div>
  <div class="wrap">
    <img class="art" src="img/owl-night.png" alt="">
    <div><div class="name">Dark Wick</div><div class="tag">Modo escuro <em>leve</em><br>para qualquer site</div></div>
  </div>
</body>
</html>
