<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="scene.css">
<style>
  body { display: grid; place-items: center; background: radial-gradient(70% 90% at 50% 60%, rgba(255, 130, 60, .22), transparent 70%), #0f0f12; }
  .wrap { display: flex; align-items: center; gap: 6%; }
  .wrap img { width: 30vh; height: 30vh; filter: drop-shadow(0 10px 30px rgba(255, 120, 50, .35)); }
  .name { white-space: nowrap; font-size: 17vh; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .tag { margin-top: 3vh; font-size: 8vh; line-height: 1.3; color: #a0a0ab; }
  .tag em { font-style: normal; color: #ffb35c; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="../../icons/icon.svg" alt="">
    <div><div class="name">Dark Wick</div><div class="tag">Modo escuro <em>leve</em><br>para qualquer site</div></div>
  </div>
</body>
</html>
