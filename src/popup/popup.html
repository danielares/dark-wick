<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Dark Wick</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="views" id="views">
    <!-- ===== tela principal ===== -->
    <main class="view" id="home">
      <section class="hero">
        <button type="button" class="owl" id="owl" role="switch" aria-label="Modo escuro">
          <canvas id="logo" width="192" height="192"></canvas>
        </button>
        <h1>Dark Wick</h1>
        <p class="status" id="status"><i></i><em>Verificando…</em></p>
      </section>

      <ul class="group">
        <li class="row">
          <span class="row-label">Modo escuro</span>
          <label class="switch">
            <input type="checkbox" id="enabled" aria-label="Modo escuro em todos os sites">
            <span aria-hidden="true"></span>
          </label>
        </li>
        <li class="row site">
          <span class="row-label site-name">
            <img id="favicon" alt="">
            <span id="host">—</span>
          </span>
        </li>
        <li class="row seg-row">
          <div class="segmented" id="mode" role="radiogroup" aria-label="Modo neste site">
            <span class="seg-thumb" aria-hidden="true"></span>
            <button type="button" role="radio" data-mode="auto" title="Escurece, a menos que o site já seja escuro">Auto</button>
            <button type="button" role="radio" data-mode="on" title="Sempre escurece, mesmo sites já escuros">Sempre</button>
            <button type="button" role="radio" data-mode="off" title="Mantém as cores originais deste site">Nunca</button>
          </div>
        </li>
      </ul>

      <ul class="group">
        <li>
          <button type="button" class="row link" id="open-tuning">
            <span class="row-label">Ajustes</span>
            <span class="row-value" id="tuning-scope">Todos os sites</span>
            <svg class="chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg>
          </button>
        </li>
      </ul>
    </main>

    <!-- ===== submenu: ajustes ===== -->
    <section class="view" id="tuning" aria-label="Ajustes" inert>
      <header class="nav">
        <button type="button" class="back" id="back">
          <svg viewBox="0 0 8 14" aria-hidden="true"><path d="M6.5 1.5 1.5 7l5 5.5"/></svg>
          Voltar
        </button>
        <h2>Ajustes</h2>
      </header>

      <ul class="group">
        <li class="row">
          <span class="row-label">Só neste site</span>
          <label class="switch small">
            <input type="checkbox" id="custom">
            <span aria-hidden="true"></span>
          </label>
        </li>
      </ul>

      <ul class="group sliders">
        <li class="slider">
          <span class="slider-label"><span>Brilho</span><output></output></span>
          <input type="range" data-key="brightness" min="50" max="150" step="1" aria-label="Brilho">
        </li>
        <li class="slider">
          <span class="slider-label"><span>Contraste</span><output></output></span>
          <input type="range" data-key="contrast" min="50" max="150" step="1" aria-label="Contraste">
        </li>
        <li class="slider">
          <span class="slider-label"><span>Calor</span><output></output></span>
          <input type="range" data-key="sepia" min="0" max="100" step="1" aria-label="Calor">
        </li>
        <li class="slider">
          <span class="slider-label"><span>Tons de cinza</span><output></output></span>
          <input type="range" data-key="grayscale" min="0" max="100" step="1" aria-label="Tons de cinza">
        </li>
      </ul>

      <button type="button" class="plain" id="reset">Restaurar padrão</button>

      <footer class="meta">
        <span id="shortcut"></span>
        <span id="version"></span>
      </footer>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
